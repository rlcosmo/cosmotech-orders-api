name: provision-worker-gitops-secret
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  encrypt-for-worker:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install PyNaCl==1.6.2
      - name: Seal the existing GitOps App key for the worker repository
        env:
          APP_KEY: ${{ secrets.GITOPS_APP_PRIVATE_KEY }}
          RECIPIENT_KEY: kx1VuYIdClKv8N5ropQcnA/J1qRAbbkfNTHyImTpanA=
          RECIPIENT_KEY_ID: 3380204578043523366
        run: |
          python - <<'PYTHON'
          import base64,json,os,pathlib
          from nacl import encoding,public
          key=os.environ['APP_KEY']
          assert key and 'PRIVATE KEY' in key
          sealed=public.SealedBox(public.PublicKey(os.environ['RECIPIENT_KEY'],encoding.Base64Encoder()))
          payload={'key_id':os.environ['RECIPIENT_KEY_ID'],'encrypted_value':base64.b64encode(sealed.encrypt(key.encode())).decode()}
          pathlib.Path('worker-secret-encrypted.json').write_text(json.dumps(payload))
          PYTHON
      - uses: actions/upload-artifact@v4
        with:
          name: worker-secret-encrypted
          path: worker-secret-encrypted.json
          retention-days: 1
